        body {

        /* Ambient Glow Shadows */

            width: 400px;

            pointer-events: none;

        /* Skeleton Loading pulse animation */
        .skeleton-loader {
            background: linear-gradient(90deg, #181818 25%, #242424 50%, #181818 75%);
            background-size: 200% 100%;
            animation: loading-pulse 1.5s infinite;
        }
        @keyframes loading-pulse {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* Cursor Glow (hidden on touch devices) */
        .custom-cursor {
            width: 8px;
            height: 8px;
            background-color: #FFBC23;
            border-radius: 50%;
            position: fixed;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 9999;
            transition: width 0.2s, height 0.2s, background-color 0.2s;
        }
        .custom-cursor-follower {
            width: 32px;
            height: 32px;
            border: 1px solid rgba(255, 188, 35, 0.3);
            border-radius: 50%;
            position: fixed;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 9998;
            transition: transform 0.08s ease-out, width 0.2s, height 0.2s, border-color 0.2s;
        }
        @media (pointer: coarse) {
            .custom-cursor, .custom-cursor-follower {
                display: none;
            }
        }

        /* Scroll Reveal base classes */
        .reveal {
            opacity: 0;
            transform: translateY(24px);
            transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* Interactive active link style for desktop header */
        .nav-link {
            position: relative;
        }
        .nav-link::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 2px;
            background-color: #FFBC23;
            transition: width 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .nav-link.active-section::after {
            width: 100%;
        }

        /* Smooth Ripple Effect container */
        .ripple-btn {
            position: relative;
            overflow: hidden;
        }
        .ripple {
            position: absolute;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 50%;
            transform: scale(0);
            animation: ripple-animation 0.6s linear;
            pointer-events: none;
        }
        @keyframes ripple-animation {
            to {
                transform: scale(4);

            }
        }
